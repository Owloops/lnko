name: CI

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Lint
        run: luacheck lnko/ bin/ spec/
      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4
      - name: Install dependencies
        run: |
          luarocks install luafilesystem
          luarocks install busted
      - name: Run tests
        run: busted spec/

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bake version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi
          {
            printf 'return {\n'
            printf '  version = "%s",\n' "$V"
            printf '  commit = "%s",\n' "${GITHUB_SHA::7}"
            printf '  built = "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '}\n'
          } > lnko/version.lua
      - name: Build all targets
        uses: Owloops/luast@main
        with:
          output: lnko-bin
          targets: linux-x86_64 linux-arm64 darwin-x86_64 darwin-arm64 windows-x86_64 windows-arm64
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: lnko-bin-*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bake version
        run: |
          {
            printf 'return {\n'
            printf '  version = "%s",\n' "${GITHUB_REF_NAME#v}"
            printf '  commit = "%s",\n' "${GITHUB_SHA::7}"
            printf '  built = "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '}\n'
          } > lnko/version.lua
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release
      - name: Prepare release files
        run: |
          cd release
          for f in lnko-bin-*; do mv "$f" "${f/lnko-bin-/lnko-}"; done
          chmod +x lnko-*
          sha256sum lnko-* > checksums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
      - name: Publish to LuaRocks
        uses: nvim-neorocks/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          template: "lnko.rockspec.template"
          summary: "Simple stow-like dotfile linker"
          detailed_description: |
            lnko helps manage dotfiles by creating relative symlinks from a
            source directory to a target directory. Features include conflict
            handling, orphan cleanup, tree folding, and Stow compatibility.
